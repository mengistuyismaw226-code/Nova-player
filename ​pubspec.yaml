name: nova_player
description: A modern, futuristic offline video player for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Playback
  video_player: ^2.9.2

  # Media scanning (videos + thumbnails from device storage)
  photo_manager: ^3.6.1

  # Permissions (READ_MEDIA_VIDEO / READ_EXTERNAL_STORAGE)
  permission_handler: ^11.3.1

  # System volume + screen brightness gesture control
  volume_controller: ^2.0.7
  screen_brightness: ^1.0.1

  # Fullscreen / orientation / wakelock
  wakelock_plus: ^1.2.8

  # Local persistence for resume positions
  shared_preferences: ^2.3.2

  # Typography for the futuristic look
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
